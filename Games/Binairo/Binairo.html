<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binairo Puzzel Game</title>
    <style>
        :root { --bg-color: #f4f7f6; --cell-size: 40px; --border-color: #333; }
        body { font-family: sans-serif; background-color: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { margin-bottom: 20px; display: flex; gap: 15px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: flex; flex-direction: column; gap: 5px; }
        select, button { padding: 8px 12px; font-size: 14px; border: 1px solid #bdc3c7; border-radius: 4px; cursor: pointer; }
        button { background-color: #3498db; color: white; border: none; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        #message { font-size: 18px; font-weight: bold; margin-bottom: 15px; min-height: 27px; }
        .success { color: #27ae60; }
        .error { color: #c0392b; }
        .grid-container { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .grid { display: grid; border: 3px solid var(--border-color); background-color: var(--border-color); gap: 1px; }
        .cell { width: var(--cell-size); height: var(--cell-size); background-color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; cursor: pointer; user-select: none; }
        .cell.thick-right { border-right: 2px solid var(--border-color); }
        .cell.thick-bottom { border-bottom: 2px solid var(--border-color); }
        .cell.fixed { background-color: #eaeded; color: #2c3e50; cursor: not-allowed; }
        .cell.user-0 { color: #e67e22; }
        .cell.user-1 { color: #9b59b6; }
    </style>
</head>
<body>
    <h1>Binairo Puzzel</h1>
    <div class="controls">
        <label>Format:
            <select id="grid-size">
                <option value="6">6 x 6</option>
                <option value="8">8 x 8</option>
                <option value="10">10 x 10</option>
                <option value="12" selected>12 x 12</option>
            </select>
        </label>
        <label>Niveau:
            <select id="difficulty">
                <option value="easy">Makkelijk</option>
                <option value="medium" selected>Gemiddeld</option>
                <option value="hard">Moeilijk</option>
            </select>
        </label>
        <button id="start-btn">Start Spel</button>
        <button id="check-btn" style="background-color: #2ecc71;">Controleer</button>
    </div>
    <div id="message"></div>
    <div class="grid-container"><div id="binairo-grid" class="grid"></div></div>
    
    <!-- Link naar de JavaScript bestanden -->
    <script src="generator.js"></script>
    <script src="game.js"></script>
</body>
</html>
