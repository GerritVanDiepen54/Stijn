<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <style>
        :root {
            --bg: #1a1a1a; --panel: #2d2d2d; --text: #fff;
            --cell: #404040; --rev: #e0e0e0; --border: #555;
        }
        body {
            font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
            margin: 0; padding: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;
        }
        .container {
            background: var(--panel); padding: 15px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 100%;
        }
        .controls { margin-bottom: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        label { display: flex; flex-direction: column; align-items: flex-start; font-size: 12px; }
        select, input, button {
            width: 100%; padding: 6px; margin-top: 4px; border-radius: 5px;
            border: 1px solid #555; background: #333; color: #fff; box-sizing: border-box;
        }
        button { grid-column: span 2; background: #00adb5; font-weight: bold; cursor: pointer; border: none; padding: 10px; }
        button:hover { background: #008c9e; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        #grid {
            display: grid; gap: 1px; background: var(--border); border: 2px solid var(--border); margin: 0 auto;
            --sz: min(4.3vw, 3.8vh);
        }
        .cell {
            width: var(--sz); height: var(--sz); background: var(--cell);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; user-select: none; font-size: calc(var(--sz) * 0.55);
        }
        .cell.revealed { background: var(--rev); color: #000; cursor: default; }
        .cell.mine { background: #ff2e63; }
        .cell.flagged { background: #ff9f43; }
        .cell.maybe { background: #f1c40f; color: #000; }
        .n1 { color: #1b7ced; } .n2 { color: #2ebd59; } .n3 { color: #ff3838; } .n4 { color: #020087; }
        .n5 { color: #800000; } .n6 { color: #008080; } .n7 { color: #000000; } .n8 { color: #808080; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <label>Columns (10-20) <input type="number" id="cols" min="10" max="20" value="10"></label>
        <label>Rows (10-20) <input type="number" id="rows" min="10" max="20" value="10"></label>
        <label style="grid-column: span 2;">Difficulty
            <select id="diff">
                <option value="0.10">Easy (10% samples)</option>
                <option value="0.15" selected>Medium (15%)</option>
                <option value="0.22">Hard (22%)</option>
            </select>
        </label>
        <button onclick="initGame()">New Game</button>
    </div>
    <div class="stats">
        <div>Mines: <span id="m-count">0</span></div>
        <div>Status: <span id="status">Playing</span></div>
    </div>
    <div id="grid"></div>
</div>

<script>
    let rows, cols, totalMines, mineGrid, revGrid, stateGrid, gameOver, firstClick;

    function initGame() {
        cols = Math.max(10, Math.min(20, parseInt(document.getElementById('cols').value) || 10));
        rows = Math.max(10, Math.min(20, parseInt(document.getElementById('rows').value) || 10));
        document.getElementById('cols').value = cols; document.getElementById('rows').value = rows;

        totalMines = Math.floor(rows * cols * parseFloat(document.getElementById('diff').value));
        gameOver = false; firstClick = true;
        
        document.getElementById('status').innerText = "Playing";
        document.getElementById('status').style.color = "#fff";
        document.getElementById('m-count').innerText = totalMines;

        mineGrid = Array(rows).fill().map(() => Array(cols).fill(false));
        revGrid = Array(rows).fill().map(() => Array(cols).fill(false));
        stateGrid = Array(rows).fill().map(() => Array(cols).fill(0)); // 0=Empty, 1=Flag, 2=Maybe

        renderGrid();
    }

    function generateMines(exR, exC) {
        let placed = 0;
        while (placed < totalMines) {
            let r = Math.floor(Math.random() * rows), c = Math.floor(Math.random() * cols);
            if (!mineGrid[r][c] && (r !== exR || c !== exC)) { mineGrid[r][c] = true; placed++; }
        }
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        grid.style.gridTemplateColumns = `repeat(${cols}, var(--sz))`;
        grid.style.gridTemplateRows = `repeat(${rows}, var(--sz))`;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.r = r; cell.dataset.c = c;
                cell.onclick = () => handleLeft(r, c);
                cell.oncontextmenu = (e) => { e.preventDefault(); handleRight(r, c); };
                grid.appendChild(cell);
            }
        }
    }

    function handleLeft(r, c) {
        if (gameOver || stateGrid[r][c] === 1 || revGrid[r][c]) return;
        if (firstClick) { firstClick = false; generateMines(r, c); }
        if (mineGrid[r][c]) { endGame(false); return; }
        reveal(r, c); checkWin();
    }

    function handleRight(r, c) {
        if (gameOver || revGrid[r][c]) return;
        
        // Cycle states: 0 (Normal) -> 1 (Flagged) -> 2 (Question/Maybe) -> 0
        stateGrid[r][c] = (stateGrid[r][c] + 1) % 3;
        
        const cell = document.querySelector(`[data-r='${r}'][data-c='${c}']`);
        cell.classList.remove('flagged', 'maybe');
        
        if (stateGrid[r][c] === 1) {
            cell.classList.add('flagged'); cell.innerText = '🚩';
        } else if (stateGrid[r][c] === 2) {
            cell.classList.add('maybe'); cell.innerText = '❓';
        } else {
            cell.innerText = '';
        }

        let flags = 0; stateGrid.forEach(row => flags += row.filter(s => s === 1).length);
        document.getElementById('m-count').innerText = totalMines - flags;
    }

    function reveal(r, c) {
        if (r < 0 || r >= rows || c < 0 || c >= cols || revGrid[r][c] || stateGrid[r][c] === 1) return;
        revGrid[r][c] = true;
        const cell = document.querySelector(`[data-r='${r}'][data-c='${c}']`);
        cell.classList.remove('maybe');
        cell.classList.add('revealed');
        
        let count = 0;
        for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
                let nr = r + i, nc = c + j;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && mineGrid[nr][nc]) count++;
            }
        }

        if (count > 0) {
            cell.innerText = count; cell.classList.add(`n${count}`);
        } else {
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) reveal(r + i, c + j);
            }
        }
    }

    function checkWin() {
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (!mineGrid[r][c] && !revGrid[r][c]) return;
            }
        }
        endGame(true);
    }

    function endGame(win) {
        gameOver = true;
        const txt = document.getElementById('status');
        txt.innerText = win ? "You Win! 🎉" : "Game Over! 💥";
        txt.style.color = win ? "#2ebd59" : "#ff3838";
        if (!win) {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (mineGrid[r][c]) {
                        const cell = document.querySelector(`[data-r='${r}'][data-c='${c}']`);
                        cell.classList.remove('maybe', 'flagged');
                        cell.classList.add('mine'); cell.innerText = '💣';
                    }
                }
            }
        }
    }
    initGame();
</script>
</body>
</html>
