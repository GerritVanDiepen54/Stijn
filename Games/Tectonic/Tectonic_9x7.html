<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tectonic Puzzel (9x7)</title>
    <style>
        :root {
            --cell-size: 55px;
            --border-thick: 3px;
            --border-thin: 1px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            cursor: pointer;
            background-color: #fff;
            transition: all 0.2s ease;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.secondary {
            background-color: #95a5a6;
        }
        button.secondary:hover {
            background-color: #7f8c8d;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(9, var(--cell-size));
            grid-template-rows: repeat(7, var(--cell-size));
            gap: 0;
            padding: var(--border-thick);
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #000;
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            border: var(--border-thin) dashed #ccc;
            background-color: #fff;
        }
        .cell.input-cell {
            background-color: #fafafa !important;
        }
        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            background: transparent;
            color: #2c3e50;
            outline: none;
        }
        .cell.input-cell input:focus {
            background-color: #e8f4fd;
        }
        .cell.given input {
            color: #000;
            font-weight: 900;
            pointer-events: none;
        }
        .cell.error input {
            color: #e74c3c !important;
            background-color: #fadbd8 !important;
        }
        .cell.success-cell input {
            color: #27ae60 !important;
            background-color: #d4efdf !important;
        }
        .b-top { border-top: var(--border-thick) solid #000 !important; }
        .b-bottom { border-bottom: var(--border-thick) solid #000 !important; }
        .b-left { border-left: var(--border-thick) solid #000 !important; }
        .b-right { border-right: var(--border-thick) solid #000 !important; }

        #message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #page-content {
            width: 522px;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="page-content">
        <h1>AI Tectonic Puzzel 9x7</h1>
        <br>Vul de vakken in. Elk gebied van N cellen bevat de getallen 1 t/m N.
        <br>Gelijke getallen mogen elkaar nooit raken.

        <div class="controls">
            <label for="difficulty">Niveau:</label>
            <select id="difficulty">
                <option value="easy">Makkelijk</option>
                <option value="medium" selected>Gemiddeld</option>
                <option value="hard">Moeilijk</option>
                <option value="expert">Expert</option>
            </select>
            <button onclick="triggerInit()">Nieuwe Puzzel</button>
            <button class="secondary" onclick="checkPuzzle()">Controleer</button>
            <button class="secondary" onclick="toggleSolution()">Oplossing</button>
        </div>

        <div id="grid"></div>
        <div id="message"></div>
    </div>

    <script>
        const R = 7;
        const C = 9;
        let solutionVals = [];
        let groupIds = [];
        let groupSizes = {};
        let initialGivens = [];
        let showingSolution = false;
        let backtrackCounter = 0;

        function getGroupColor(id) {
            const hues = [0, 30, 60, 90, 140, 180, 210, 240, 280, 320];
            const hash = (id * 13) % hues.length;
            return `hsla(${hues[hash]}, 70%, 93%, 1)`;
        }

        function triggerInit() {
            const msg = document.getElementById('message');
            msg.innerText = "Puzzel genereren...";
            msg.style.color = "#333";
            showingSolution = false;

            setTimeout(() => {
                initPuzzle();
            }, 50);
        }

        function initPuzzle() {
            let success = false;
            for (let poging = 0; poging < 50; poging++) {
                backtrackCounter = 0;
                if (generateBoard()) {
                    success = true;
                    break;
                }
            }

            if (success) {
                defineGivens();
                renderBoard();
                document.getElementById('message').innerText = "";
            } else {
                document.getElementById('message').innerText = "Fout bij genereren. Probeer het opnieuw.";
                document.getElementById('message').style.color = "red";
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateBoard() {
            solutionVals = Array.from({length: R}, () => Array(C).fill(0));
            groupIds = Array.from({length: R}, () => Array(C).fill(0));
            groupSizes = {};
            
            let currentGroupId = 1;
            for(let r=0; r<R; r++) {
                for(let c=0; c<C; c++) {
                    if(groupIds[r][c] === 0) {
                        let size = 0;
                        let queue = [{r, c}];
                        let id = currentGroupId++;
                        groupSizes[id] = 0;
                        
                        while(queue.length > 0 && size < 5) {
                            let curr = queue.shift();
                            if(groupIds[curr.r][curr.c] === 0) {
                                groupIds[curr.r][curr.c] = id;
                                groupSizes[id]++;
                                size++;
                                
                                let neighbors = [];
                                if(curr.r < R-1) neighbors.push({r: curr.r+1, c: curr.c});
                                if(curr.c < C-1) neighbors.push({r: curr.r, c: curr.c+1});
                                shuffle(neighbors).forEach(n => queue.push(n));
                            }
                        }
                    }
                }
            }

            return fillValues(0, 0);
        }

        function fillValues(r, c) {
            backtrackCounter++;
            if (backtrackCounter > 2000) return false; 

            if (c === C) { c = 0; r++; }
            if (r === R) return true;

            let id = groupIds[r][c];
            let maxVal = groupSizes[id];
            let nums = shuffle(Array.from({length: maxVal}, (_, i) => i + 1));

            for (let num of nums) {
                if (isValidValue(r, c, num)) {
                    solutionVals[r][c] = num;
                    if (fillValues(r, c + 1)) return true;
                    solutionVals[r][c] = 0;
                }
            }
            return false;
        }

        function isValidValue(r, c, num) {
            let targetId = groupIds[r][c];
            for (let i = 0; i < R; i++) {
                for (let j = 0; j < C; j++) {
                    if (groupIds[i][j] === targetId && solutionVals[i][j] === num) {
                        return false;
                    }
                }
            }

            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    let nr = r + dr;
                    let nc = c + dc;
                    if (nr >= 0 && nr < R && nc >= 0 && nc < C) {
                        if (solutionVals[nr][nc] === num) return false;
                    }
                }
            }
            return true;
        }

        function defineGivens() {
            initialGivens = Array.from({length: R}, () => Array(C).fill(false));
            let diff = document.getElementById('difficulty').value;
            
            let rate = 0.4;
            if (diff === 'easy') rate = 0.5;
            if (diff === 'hard') rate = 0.3;
            if (diff === 'expert') rate = 0.2;

            for (let r = 0; r < R; r++) {
                for (let c = 0; c < C; c++) {
                    if (Math.random() < rate) {
                        initialGivens[r][c] = true;
                    }
                }
            }
        }

        function renderBoard() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            for (let r = 0; r < R; r++) {
                for (let c = 0; c < C; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.backgroundColor = getGroupColor(groupIds[r][c]);

                    let id = groupIds[r][c];
                    if (r === 0 || groupIds[r-1][c] !== id) cell.classList.add('b-top');
                    if (r === R-1 || groupIds[r+1][c] !== id) cell.classList.add('b-bottom');
                    if (c === 0 || groupIds[r][c-1] !== id) cell.classList.add('b-left');
                    if (c === C-1 || groupIds[r][c+1] !== id) cell.classList.add('b-right');

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.id = `cell-${r}-${c}`;

                    if (initialGivens[r][c]) {
                        cell.classList.add('given');
                        input.value = solutionVals[r][c];
                    } else {
                        cell.classList.add('input-cell');
                    }

                    cell.appendChild(input);
                    grid.appendChild(cell);
                }
            }
        }

        function checkPuzzle() {
            // Haal de huidige grid-waarden op uit de inputvelden van de gebruiker
            let currentGrid = Array.from({length: R}, () => Array(C).fill(0));
            let isComplete = true;

            // Reset visuele indicators
            for (let r = 0; r < R; r++) {
                for (let c = 0; c < C; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    cell.parentElement.classList.remove('error', 'success-cell');
                    let val = parseInt(cell.value);
                    if (isNaN(val) || val < 1) {
                        isComplete = false;
                        currentGrid[r][c] = 0;
                    } else {
                        currentGrid[r][c] = val;
                    }
                }
            }

            const msg = document.getElementById('message');
            if (!isComplete) {
                msg.innerText = "De puzzel is nog niet volledig ingevuld.";
                msg.style.color = "red";
                return;
            }

            // Valideer de ingevoerde waarden op basis van de officiële Tectonic spelregels
            let allValid = true;

            for (let r = 0; r < R; r++) {
                for (let c = 0; c < C; c++) {
                    let val = currentGrid[r][c];
                    let id = groupIds[r][c];
                    let maxVal = groupSizes[id];
                    const cellElement = document.getElementById(`cell-${r}-${c}`).parentElement;

                    let cellValid = true;

                    // Regel 1: Waarde moet tussen 1 en groepsgrootte liggen
                    if (val > maxVal) {
                        cellValid = false;
                    }

                    // Regel 2: Uniek zijn binnen de eigen groep
                    if (cellValid) {
                        for (let i = 0; i < R; i++) {
                            for (let j = 0; j < C; j++) {
                                if ((i !== r || j !== c) && groupIds[i][j] === id && currentGrid[i][j] === val) {
                                    cellValid = false;
                                }
                            }
                        }
                    }

                    // Regel 3: Mag geen gelijke buren raken (horizontaal, verticaal, diagonaal)
                    if (cellValid) {
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                let nr = r + dr;
                                let nc = c + dc;
                                if (nr >= 0 && nr < R && nc >= 0 && nc < C) {
                                    if (currentGrid[nr][nc] === val) {
                                        cellValid = false;
                                    }
                                }
                            }
                        }
                    }

                    // Kleur het vakje op basis van de individuele validatie
                    if (!cellValid) {
                        allValid = false;
                        if (!initialGivens[r][c]) {
                            cellElement.classList.add('error');
                        }
                    } else {
                        if (!initialGivens[r][c]) {
                            cellElement.classList.add('success-cell');
                        }
                    }
                }
            }

            if (allValid) {
                msg.innerText = "Gefeliciteerd! De puzzel is correct opgelost volgens de Tectonic regels.";
                msg.style.color = "green";
            } else {
                msg.innerText = "Er zitten regelovertredingen in je oplossing (gemarkeerd in rood).";
                msg.style.color = "red";
            }
        }

        function toggleSolution() {
            showingSolution = !showingSolution;
            for (let r = 0; r < R; r++) {
                for (let c = 0; c < C; c++) {
                    if (!initialGivens[r][c]) {
                        const cell = document.getElementById(`cell-${r}-${c}`);
                        cell.value = showingSolution ? solutionVals[r][c] : '';
                        cell.parentElement.classList.remove('error', 'success-cell');
                    }
                }
            }
        }
        
        window.onload = triggerInit;
    </script>
</body>
</html>
