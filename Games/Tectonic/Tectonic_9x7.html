<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamische Tectonic Puzzel (9x7)</title>
    <style>
        :root {
            --cell-size: 55px;
            --border-thick: 3px;
            --border-thin: 1px;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .controls {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        select, button {
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #bdc3c7;
            cursor: pointer;
            background-color: #fff;
            transition: all 0.2s ease;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.secondary {
            background-color: #95a5a6;
        }
        button.secondary:hover {
            background-color: #7f8c8d;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(9, var(--cell-size));
            grid-template-rows: repeat(7, var(--cell-size));
            gap: 0;
            background-color: #000;
            padding: var(--border-thick);
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            border: var(--border-thin) dashed #ccc;
        }
        /* Invoercellen hebben een neutrale lichte achtergrond */
        .cell.input-cell {
            background-color: #fafafa !important;
        }
        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            background: transparent;
            color: #2c3e50;
            outline: none;
            transition: background-color 0.2s ease;
        }
        .cell.input-cell input:focus {
            background-color: #e8f4fd;
        }
        .cell.given input {
            color: #000;
            font-weight: 900;
            pointer-events: none;
        }
        .cell.error input {
            color: #e74c3c !important;
            background-color: #fadbd8 !important;
        }
        .cell.success-cell input {
            color: #27ae60 !important;
            background-color: #d4efdf !important;
        }
        /* Groepsgrenzen dikke lijnen */
        .b-top { border-top: var(--border-thick) solid #000 !important; }
        .b-bottom { border-bottom: var(--border-thick) solid #000 !important; }
        .b-left { border-left: var(--border-thick) solid #000 !important; }
        .b-right { border-right: var(--border-thick) solid #000 !important; }

        #message {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <h1>AI_Tectonic Puzzel 9x7</h1>
    <p>Vul de vakken in. Elk gebied van <i>n</i> cellen bevat de getallen 1 t/m <i>n</i>. Gelijke getallen mogen elkaar nooit raken.</p>

    <div class="controls">
        <label for="difficulty">Niveau:</label>
        <select id="difficulty">
            <option value="easy">Makkelijk</option>
            <option value="medium" selected>Gemiddeld</option>
            <option value="hard">Moeilijk</option>
            <option value="expert">Expert</option>
        </select>
        <button onclick="initPuzzle()">Nieuwe Puzzel</button>
        <button class="secondary" onclick="checkPuzzle()">Controleer</button>
        <button class="secondary" onclick="toggleSolution()">Oplossing Spieken</button>
    </div>

    <div id="grid"></div>
    <div id="message"></div>

    <script>
        const R = 7;
        const C = 9;
        let solutionVals = [];
        let groupIds = [];
        let groupSizes = {};
        let showingSolution = false;

        function getGroupColor(id) {
            const hues = [0, 30, 60, 90, 140, 180, 210, 240, 280, 320];
            const hash = (id * 13) % hues.length;
            return `hsla(${hues[hash]}, 70%, 93%, 1)`;
        }

        function initPuzzle() {
            document.getElementById('message').innerText = "Puzzel genereren...";
            document.getElementById('message').style.color = "#333";
            showingSolution = false;
            
            setTimeout(() => {
                if (generateBoard()) {
                    renderBoard();
                    document.getElementById('message').innerText = "";
                } else {
                    document.getElementById('message').innerText = "Fout bij genereren. Probeer het opnieuw.";
                    document.getElementById('message').style.color = "red";
                }
            }, 50);
        }

        function generateBoard() {
            solutionVals = Array.from({length: R}, () => Array(C).fill(0));
            groupIds = Array.from({length: R}, () => Array(C).fill(0));
            groupSizes = {};
            let regCounter = 0;

            function getUnassigned() {
                for(let r=0; r<R; r++) {
                    for(let c=0; c<C; c++) {
                        if(groupIds[r][c] === 0) return {r, c};
                    }
                }
                return null;
            }

            function getNeighbors(r, c) {
                const res = [];
                if (r > 0) res.push({r: r-1, c});
                if (r < R-1) res.push({r: r+1, c});
                if (c > 0) res.push({r, c: c-1});
                if (c < C-1) res.push({r, c: c+1});
                return res;
            }

            function isValidValue(r, c, val) {
                for(let dr=-1; dr<=1; dr++) {
                    for(let dc=-1; dc<=1; dc++) {
                        if(dr === 0 && dc === 0) continue;
                        let nr = r + dr, nc = c + dc;
                        if(nr >= 0 && nr < R && nc >= 0 && nc < C) {
                            if(solutionVals[nr][nc] === val) return false;
                        }
                    }
                }
                return true;
            }

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            function backtrack() {
                const pos = getUnassigned();
                if (!pos) return true;
                const {r, c} = pos;

                let connected = [{r, c}];
                let queue = [{r, c}];
                let visited = new Set([`${r},${c}`]);
                
                while(queue.length > 0 && connected.length < 15) {
                    let curr = queue.shift();
                    let nbs = getNeighbors(curr.r, curr.c);
                    for(let nb of nbs) {
                        let key = `${nb.r},${nb.c}`;
                        if(groupIds[nb.r][nb.c] === 0 && !visited.has(key)) {
                            visited.add(key);
                            connected.push(nb);
                            queue.push(nb);
                        }
                    }
                }

                let maxPossibleSize = Math.min(5, connected.length);
                if(maxPossibleSize === 0) return false;

                regCounter++;
                let rid = regCounter;

                let sizes = [];
                for(let s=1; s<=maxPossibleSize; s++) sizes.push(s);
                shuffle(sizes);
                sizes.sort((a,b) => b - a);

                for(let size of sizes) {
                    let compOptions = [];

                    function findComps(currComp, availNeighbors) {
                        if(currComp.size === size) {
                            compOptions.push(Array.from(currComp).map(k => {
                                let [cr, cc] = k.split(',').map(Number);
                                return {r: cr, c: cc};
                            }));
                            return true;
                        }
                        if(availNeighbors.size === 0) return false;

                        let neighborsList = Array.from(availNeighbors);
                        shuffle(neighborsList);

                        for(let nextStr of neighborsList) {
                            let [nr, nc] = nextStr.split(',').map(Number);
                            let newComp = new Set(currComp);
                            newComp.add(nextStr);

                            let newAvail = new Set(availNeighbors);
                            newAvail.delete(nextStr);

                            for(let nb of getNeighbors(nr, nc)) {
                                let nbStr = `${nb.r},${nb.c}`;
                                if(groupIds[nb.r][nb.c] === 0 && !newComp.has(nbStr)) {
                                    newAvail.add(nbStr);
                                }
                            }

                            if(findComps(newComp, newAvail)) {
                                if(compOptions.length >= 2) return true;
                            }
                        }
                        return false;
                    }

                    let initialAvail = new Set();
                    for(let nb of getNeighbors(r, c)) {
                        if(groupIds[nb.r][nb.c] === 0) initialAvail.add(`${nb.r},${nb.c}`);
                    }

                    findComps(new Set([`${r},${c}`]), initialAvail);
                    shuffle(compOptions);

                    for(let comp of compOptions) {
                        for(let cell of comp) groupIds[cell.r][cell.c] = rid;
                        groupSizes[rid] = size;

                        let vals = [];
                        for(let v=1; v<=size; v++) vals.push(v);

                        function assignVals(idx) {
                            if(idx === comp.length) return true;
                            let cell = comp[idx];
                            shuffle(vals);

                            for(let v of vals) {
                                let usedInReg = false;
                                for(let i=0; i<idx; i++) {
                                    if(solutionVals[comp[i].r][comp[i].c] === v) { usedInReg = true; break; }
                                }
                                if(usedInReg) continue;

                                if(isValidValue(cell.r, cell.c, v)) {
                                    solutionVals[cell.r][cell.c] = v;
                                    if(assignVals(idx + 1)) return true;
                                    solutionVals[cell.r][cell.c] = 0;
                                }
                            }
                            return false;
                        }

                        if(assignVals(0)) {
                            if(backtrack()) return true;
                            for(let cell of comp) solutionVals[cell.r][cell.c] = 0;
                        }

                        for(let cell of comp) groupIds[cell.r][cell.c] = 0;
                    }
                }
                regCounter--;
                return false;
            }

            return backtrack();
        }

        function renderBoard() {
            const gridDiv = document.getElementById('grid');
            gridDiv.innerHTML = '';

            const difficulty = document.getElementById('difficulty').value;
            let keepProbability = 0.45; 
            if(difficulty === 'easy') keepProbability = 0.65;
            if(difficulty === 'hard') keepProbability = 0.30;
            if(difficulty === 'expert') keepProbability = 0.18;

            for(let r=0; r<R; r++) {
                for(let c=0; c<C; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';
                    
                    const gid = groupIds[r][c];
                    const gSize = groupSizes[gid];

                    if(r === 0 || groupIds[r-1][c] !== gid) cellDiv.classList.add('b-top');
                    if(r === R-1 || groupIds[r+1][c] !== gid) cellDiv.classList.add('b-bottom');
                    if(c === 0 || groupIds[r][c-1] !== gid) cellDiv.classList.add('b-left');
                    if(c === C-1 || groupIds[r][c+1] !== gid) cellDiv.classList.add('b-right');

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.dataset.r = r;
                    input.dataset.c = c;

                    if(Math.random() < keepProbability) {
                        input.value = solutionVals[r][c];
                        cellDiv.classList.add('given');
                        cellDiv.style.backgroundColor = getGroupColor(gid);
                    } else {
                        cellDiv.classList.add('input-cell');
                        input.addEventListener('input', function() {
                            this.value = this.value.replace(/[^1-5]/g, '');
                            if(parseInt(this.value) > gSize) {
                                this.value = '';
                            }
                            cellDiv.classList.remove('error', 'success-cell');
                        });
                    }

                    cellDiv.appendChild(input);
                    gridDiv.appendChild(cellDiv);
                }
            }
        }

        function checkPuzzle() {
            if (showingSolution) return;
            let inputs = document.querySelectorAll('.cell input');
            let allCorrect = true;
            let missingOrWrong = false;

            inputs.forEach(input => {
                let cellDiv = input.parentElement;
                if(cellDiv.classList.contains('given')) return;

                let r = input.dataset.r;
                let c = input.dataset.c;
                let userVal = parseInt(input.value);
                let correctVal = solutionVals[r][c];

                if(!userVal) {
                    missingOrWrong = true;
                    allCorrect = false;
                } else if(userVal !== correctVal) {
                    cellDiv.classList.add('error');
                    missingOrWrong = true;
                    allCorrect = false;
                } else {
                    cellDiv.classList.remove('error');
                    cellDiv.classList.add('success-cell');
                }
            });

            const msg = document.getElementById('message');
            if(allCorrect) {
                msg.innerText = "Gefeliciteerd! De puzzel is helemaal correct opgelost! 🎉";
                msg.style.color = "#27ae60";
            } else if(missingOrWrong) {
                msg.innerText = "Er zitten nog fouten in of de puzzel is noch niet compleet.";
                msg.style.color = "#e74c3c";
            }
        }

        function toggleSolution() {
            let inputs = document.querySelectorAll('.cell input');
            showingSolution = !showingSolution;

            inputs.forEach(input => {
                let cellDiv = input.parentElement;
                if(cellDiv.classList.contains('given')) return;

                let r = input.dataset.r;
                let c = input.dataset.c;

                if(showingSolution) {
                    input.value = solutionVals[r][c];
                    cellDiv.classList.add('success-cell');
                    input.style.pointerEvents = 'none';
                } else {
                    input.value = '';
                    cellDiv.classList.remove('success-cell', 'error');
                    input.style.pointerEvents = 'auto';
                }
            });

            document.getElementById('message').innerText = showingSolution ? "Oplossing wordt getoond." : "";
            document.getElementById('message').style.color = "#3498db";
        }

        window.onload = initPuzzle;
    </script>
</body>
</html>
