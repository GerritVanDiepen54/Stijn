<style>
.group_large {
  display: flex;          /* Maakt de container een flexbox */
  align-items: center;    /* Zorgt voor perfecte verticale uitlijning */
  gap: 4px;               /*  Geeft wat ruimte tussen de button en de afbeelding */
  margin-top: 4px;
}

.button_large {
  width: 34px;
  height: 34px;
  background-color:beige;
  /* padding: 4 15px;      */
  box-sizing: border-box;  /* Zorgt dat padding de button niet hoger maakt dan 34px */
}
.button_large_OK {
  width: 34px;
  height: 34px;
  /* padding: 4 15px;      */
  background-color: aquamarine;
  box-sizing: border-box;  /* Zorgt dat padding de button niet hoger maakt dan 34px */
}

.img_large {
  opacity: 0.4;
  height: 34px;
  width: 34px;
  display: block;          /* Verwijdert de standaard witruimte onder een afbeelding */
  box-sizing: border-box;
  border: 1px solid black;
}

.img_large_mark {
  opacity: 0.4;
  height: 34px;
  width: 34px;
  display: block;          /* Verwijdert de standaard witruimte onder een afbeelding */
  box-sizing: border-box;
  border: 4px solid aquamarine;
}

.img_large_error {
  opacity: 0.4;
  height: 34px;
  width: 34px;
  display: block;          /* Verwijdert de standaard witruimte onder een afbeelding */
  box-sizing: border-box;
  border: 8px solid red;
}

.img_large_fixed {
  height: 34px;
  width: 34px;
  display: block;          /* Verwijdert de standaard witruimte onder een afbeelding */
  box-sizing: border-box;
  border: 2px solid green;
}

.group_small {
  display: flex;          /* Maakt de container een flexbox */
  align-items: center;    /* Zorgt voor perfecte verticale uitlijning */
  gap: 2px;               /*  Geeft wat ruimte tussen de button en de afbeelding */
  margin-top: 2px;
}

.button_small {
  width: 24px;
  height: 24px;
  box-sizing: border-box;  /* Zorgt dat padding de button niet hoger maakt dan 24px */
}

.button_small_OK {
  width: 24px;
  height: 24px;
  background-color: aquamarine;
  box-sizing: border-box;  /* Zorgt dat padding de button niet hoger maakt dan 24px */
}

.img_small {
  height: 24px;
  width: 24px;
  display: block;          /* Verwijdert de standaard witruimte onder een afbeelding */
}

/* 
boten:      kies:

*/
